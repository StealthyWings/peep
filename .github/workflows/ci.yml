name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npx oxlint
      - name: Build
        run: npx vite build
      - name: Flock server smoke test
        run: |
          PEEP_DB=/tmp/ci.db node server/index.mjs --port 8787 &
          for i in $(seq 1 20); do curl -sf localhost:8787/api/health && break; sleep 0.5; done
          TOKEN=$(curl -sf -X POST localhost:8787/api/register -H 'Content-Type: application/json' \
            -d '{"name":"CI","emoji":"sage"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          CODE=$(curl -sf -X POST localhost:8787/api/groups -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"name":"CI flock"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).code')
          test -n "$CODE"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/groups)" = 401
          echo "Flock API OK (code $CODE)"
